name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A repo nobody commits to still rots: a runner image change, a transitive
  # dependency yanked from the registry, an action reaching end of life. The
  # monthly run is how that surfaces as a red build instead of as a surprise
  # the next time you actually need to ship. GitHub disables scheduled runs
  # after 60 days with no repository activity, and emails first; Dependabot's
  # weekly PRs count as activity.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run package

      # Downloadable build, so trying the extension does not require a
      # local toolchain. Retained for 90 days by default.
      - uses: actions/upload-artifact@v7
        with:
          name: markdown-claude-review-vsix
          path: markdown-claude-review.vsix
          if-no-files-found: error
