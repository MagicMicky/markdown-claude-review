# Releases, cut two ways.
#
# Automatically: any change to main that affects what ships gets a patch
# release. That is what carries an auto-merged Dependabot update through to
# the Marketplace, and so to an installed editor — without it those updates
# land on main and stop there, which makes the whole auto-merge chain
# decorative.
#
# Deliberately, for a minor or major: push a tag and this releases exactly it.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Note that a tag pushed by this workflow cannot trigger another workflow —
# GitHub suppresses that to prevent recursion — so the tag has to be created
# and released within one run rather than handed to a separate tagging job.
# That is also what makes the automatic path safe from looping.
#
# Every release produces a permanent GitHub Release with the .vsix attached,
# which is how the extension gets onto a machine without a toolchain:
#
#   gh release download -R MagicMicky/markdown-claude-review -p '*.vsix'
#   code --install-extension markdown-claude-review.vsix
#
# CI's build artifacts expire after 90 days; release assets do not, which is
# the whole reason this exists separately from ci.yml.
name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    # Changes that cannot alter the packaged extension must not spend a
    # version number. Note this also excludes .github, so a Dependabot bump of
    # an action releases nothing — correctly, since no shipped byte moved.
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'LICENSE'
      - '.vscode/**'
      - '.gitignore'
      - '.vscodeignore'

permissions:
  contents: write

# Two merges in quick succession must not race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The next patch number is derived from the tag history, so the
          # default shallow fetch is not enough.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The released version is derived, never read from the committed
      # package.json. A patch release triggered by an auto-merged dependency
      # bump has nobody around to edit a version field first, and a bot
      # committing one back to main would have to get past branch protection.
      # Tags are the version history instead; package.json is set to match at
      # build time so the packaged manifest and the release always agree.
      #
      # The committed version therefore only sets the floor for the very first
      # release. To move to a new minor or major, push that tag by hand and
      # subsequent patches continue from it.
      - name: Determine version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "Releasing $version, from the pushed tag."
          else
            # A re-run must not burn a fresh version number. If an earlier
            # attempt already tagged this commit — it tags before publishing,
            # so a failed publish leaves exactly that state — release the same
            # version again. This is what makes the recovery instructions in
            # the failure summary ("rotate the secret, re-run") true.
            already="$(git tag --points-at HEAD -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"

            if [ -n "$already" ]; then
              version="${already#v}"
              echo "This commit is already tagged $already; re-releasing that version."
            elif [ -z "$latest" ]; then
              version="$(node -p "require('./package.json').version")"
              echo "No release tags yet; starting from package.json at $version."
            else
              version="$(node -p "
                const p = '${latest#v}'.split('.').map(Number);
                [p[0], p[1], p[2] + 1].join('.');
              ")"
              echo "Latest tag is $latest; releasing $version."
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set the packaged version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      # Created before anything is published, so a later failure leaves the
      # tag pointing at exactly the commit that was built and tested.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, from an earlier attempt at this commit."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          TAG: ${{ steps.version.outputs.tag }}

      # Idempotent on purpose. When a publish step below fails on an expired
      # token, the fix is to rotate the secret and re-run this workflow — which
      # only works if re-creating an existing release is not itself an error.
      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" markdown-claude-review.vsix --clobber
          else
            gh release create "$TAG" markdown-claude-review.vsix \
              --title "$TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

      # Registry publishing, skipped when the matching secret is absent.
      #
      # Both continue-on-error so that one dead credential cannot stop the
      # other registry from getting the release; the report step below turns
      # either failure back into a red build, with instructions.
      # --skip-duplicate so that re-running a release whose version already
      # reached the registry is a no-op rather than an error. The recovery path
      # for a failed publish is to re-run, and the version does not change on a
      # re-run, so this is what stops the second registry's retry from being
      # blocked by the first registry's success.
      - name: Publish to the VS Code Marketplace
        id: marketplace
        if: env.VSCE_PAT != ''
        continue-on-error: true
        timeout-minutes: 10
        run: npx vsce publish --packagePath markdown-claude-review.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX refuses to publish into a namespace that does not exist yet,
      # and creating one is a one-off that would otherwise be an undocumented
      # manual prerequisite. It errors when the namespace is already there,
      # which on every release after the first is the expected case.
      - name: Ensure the Open VSX namespace exists
        if: env.OVSX_PAT != ''
        continue-on-error: true
        timeout-minutes: 5
        run: npx ovsx create-namespace magicmicky -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        id: openvsx
        if: env.OVSX_PAT != ''
        continue-on-error: true
        timeout-minutes: 10
        run: npx ovsx publish markdown-claude-review.vsix -p "$OVSX_PAT" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # The failure that this repo is most likely to hit is an expired
      # credential, months or years after anyone last looked at this file. The
      # notification email links here, so the run summary is where the recovery
      # steps have to be — not in a doc the reader would have to go find.
      - name: Explain publish failures
        if: steps.marketplace.outcome == 'failure' || steps.openvsx.outcome == 'failure'
        env:
          MARKETPLACE: ${{ steps.marketplace.outcome }}
          OPENVSX: ${{ steps.openvsx.outcome }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Publishing failed for \`$TAG\`"
            echo
            echo "The GitHub Release itself was created and \`markdown-claude-review.vsix\`"
            echo "is attached to it. Installing from the release is unaffected — only the"
            echo "registry upload failed, so existing users simply will not be offered an"
            echo "automatic update to this version yet."
            echo
            echo "**The usual cause is an expired publishing token.** Azure DevOps personal"
            echo "access tokens expire after a year at most, and nothing warns you before"
            echo "they do."
            echo

            if [ "$MARKETPLACE" = failure ]; then
              echo "### VS Code Marketplace — rotate \`VSCE_PAT\`"
              echo
              echo "1. Sign in to <https://dev.azure.com> with the Microsoft account that owns"
              echo "   the \`magicmicky\` publisher, and open **User settings → Personal Access"
              echo "   Tokens → New Token**."
              echo "2. Set **Organization** to \`All accessible organizations\`. A token scoped to"
              echo "   a single organization fails authentication with an unhelpful 401 — this"
              echo "   is the most common mistake."
              echo "3. Set **Scopes** to \`Custom defined\`, then check **Marketplace → Manage**."
              echo "4. Set the expiration (one year is the maximum) and copy the token; it is"
              echo "   shown only once."
              echo "5. Store it:"
              echo
              echo '   ```sh'
              echo "   gh secret set VSCE_PAT --repo $REPO"
              echo '   ```'
              echo
              echo "Publisher management lives at <https://marketplace.visualstudio.com/manage>."
              echo
            fi

            if [ "$OPENVSX" = failure ]; then
              echo "### Open VSX — rotate \`OVSX_PAT\`"
              echo
              echo "Open VSX tokens do not expire, so a failure here is more likely a revoked"
              echo "token, an unsigned publisher agreement, or a transient registry outage —"
              echo "check the step log before assuming the credential is at fault."
              echo
              echo "1. Sign in to <https://open-vsx.org>, open **Settings → Access Tokens**, and"
              echo "   generate a new one. Confirm the publisher agreement is still signed."
              echo "2. Store it:"
              echo
              echo '   ```sh'
              echo "   gh secret set OVSX_PAT --repo $REPO"
              echo '   ```'
              echo
            fi

            echo "### Then re-run"
            echo
            echo "Use **Re-run failed jobs** on this run. The release step is idempotent, so"
            echo "re-running against an existing tag re-uploads the asset rather than failing."
            echo "No new tag or version bump is needed."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Publishing failed — likely an expired token::The GitHub Release was created successfully; only the registry upload failed. See this run's summary for how to rotate the credential and re-run."
          exit 1
